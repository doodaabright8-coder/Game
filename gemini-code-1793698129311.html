<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate 3D Car Driving Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Minimalist HUD Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        #hud h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #818cf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #hud p {
            font-size: 0.9rem;
            margin: 0;
            color: #94a3b8;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            color: #f8fafc;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>QORIGHTS SIMULATOR</h1>
        <p>Speed: <span id="speedDisplay">0</span> KM/H</p>
    </div>

    <div id="controls-hint">
        Use <b>W A S D</b> or <b>Arrow Keys</b> to Drive | <b>Spacebar</b> to Brake
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1d);
        scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Ground Track
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Add Road Grid Lines
        const gridHelper = new THREE.GridHelper(1000, 100, 0x6366f1, 0x334155);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Create 3D Car Model
        const carGroup = new THREE.Group();

        // Car Body
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.3, metalness: 0.8 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.6;
        body.castShadow = true;
        carGroup.add(body);

        // Car Cabin
        const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.2, -0.2);
        cabin.castShadow = true;
        carGroup.add(cabin);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
        
        const wheels = [];
        const wheelPositions = [
            [-1.1, 0.4, 1.3],  // Front Left
            [1.1, 0.4, 1.3],   // Front Right
            [-1.1, 0.4, -1.3], // Rear Left
            [1.1, 0.4, -1.3]   // Rear Right
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            wheel.castShadow = true;
            carGroup.add(wheel);
            wheels.push(wheel);
        });

        scene.add(carGroup);

        // Add some environmental objects (Buildings / Obstacles)
        const boxGeo = new THREE.BoxGeometry(4, 8, 4);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
        for (let i = 0; i < 40; i++) {
            const building = new THREE.Mesh(boxGeo, boxMat);
            const angle = Math.random() * Math.PI * 2;
            const dist = 60 + Math.random() * 200;
            building.position.set(Math.cos(angle) * dist, 4, Math.sin(angle) * dist);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
        }

        // Physics & Controls state
        const keys = { forward: false, backward: false, left: false, right: false, brake: false };
        let speed = 0;
        let steering = 0;
        let carAngle = 0;

        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': keys.forward = isDown; break;
                case 's': case 'arrowdown': keys.backward = isDown; break;
                case 'a': case 'arrowleft': keys.left = isDown; break;
                case 'd': case 'arrowright': keys.right = isDown; break;
                case ' ': keys.brake = isDown; break;
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Acceleration & Braking physics
            if (keys.forward) speed += 0.015;
            else if (keys.backward) speed -= 0.01;
            else if (keys.brake) speed *= 0.92;
            else speed *= 0.98; // Natural friction

            // Top speed clamps
            speed = Math.max(-0.4, Math.min(1.2, speed));

            // Steering physics
            if (Math.abs(speed) > 0.02) {
                const turnRate = 0.025 * (speed > 0 ? 1 : -1);
                if (keys.left) steering += turnRate;
                else if (keys.right) steering -= turnRate;
                else steering *= 0.8; // Return wheels center
            } else {
                steering *= 0.8;
            }
            steering = Math.max(-0.6, Math.min(0.6, steering));

            carAngle += steering * (speed * 1.2);
            carGroup.rotation.y = carAngle;

            // Move car forward based on angle
            carGroup.position.x += Math.sin(carAngle) * speed;
            carGroup.position.z += Math.cos(carAngle) * speed;

            // Rotate wheels when driving
            wheels.forEach(w => w.rotation.x += speed * 2);

            // Cinematic Camera Follow
            const targetCamX = carGroup.position.x - Math.sin(carAngle) * 12;
            const targetCamZ = carGroup.position.z - Math.cos(carAngle) * 12;
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;
            camera.position.y = carGroup.position.y + 5;
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

            // Update UI Speedometer
            document.getElementById('speedDisplay').innerText = Math.round(Math.abs(speed) * 120);

            renderer.render(scene, camera);
        }

        animate();

        // Responsive window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
